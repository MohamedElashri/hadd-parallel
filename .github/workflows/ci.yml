name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
      - name: Ruff lint (version pinned by pyproject.toml)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # sanad: ref=v4.1.0
      - name: Ruff format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # sanad: ref=v4.1.0
        with:
          args: format --check .

  test:
    name: Test py${{ matrix.python-version }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # sanad: ref=v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
      - name: Install package and dev dependencies
        run: uv pip install -e '.[dev]'
      - name: Run tests
        run: pytest --cov=phadd --cov-report=term-missing -v
      - name: Smoke test CLI
        run: |
          phadd --version
          phadd --help

  build:
    name: Build & check distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # sanad: ref=v10.1.0
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: |
          uv tool install twine
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # sanad: ref=v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
