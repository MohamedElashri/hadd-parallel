[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "parallel-hadd"
description = "Merge ROOT files in parallel using hadd"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Elashri", email = "python@melashri.net" }]
requires-python = ">=3.10"
keywords = ["hadd", "ROOT", "ROOT histogram", "Physics", "ROOT CERN", "Histograms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MohamedElashri/hadd-parallel"
Documentation = "https://github.com/MohamedElashri/hadd-parallel#readme"
Source = "https://github.com/MohamedElashri/hadd-parallel"
Issues = "https://github.com/MohamedElashri/hadd-parallel/issues"
Changelog = "https://github.com/MohamedElashri/hadd-parallel/releases"

[project.optional-dependencies]
rich = ["rich>=15.0.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[project.scripts]
phadd = "phadd.cli:main"

[tool.hatch.version]
path = "src/phadd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phadd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
